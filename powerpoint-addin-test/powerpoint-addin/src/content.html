<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SBRS Vehicle Dynamics</title>
  <link rel="icon" href="icon.png" type="image/png">
</head>
<body>
  <main class="shell" aria-label="SBRS Vehicle Dynamics">
    <iframe id="vehicle-frame" title="SBRS Vehicle Dynamics" allow="fullscreen; autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <script>
    (async function () {
      let build = "dev";
      try {
        const response = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
        build = (await response.json()).version || build;
      } catch (_error) {}
      window.SBRS_POC_BUILD_VERSION = build;
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "design-tokens.css?v=" + encodeURIComponent(build);
      document.head.appendChild(css);
      for (const file of ["poc-config.js", "content.js"]) {
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = file + "?v=" + encodeURIComponent(build);
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      }
    })();
  </script>
</body>
</html>
