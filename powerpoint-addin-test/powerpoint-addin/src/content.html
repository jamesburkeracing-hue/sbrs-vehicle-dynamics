<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>SBRS Vehicle Dynamics — PowerPoint POC</title>
  <link rel="icon" href="icon.png" type="image/png">
  <style>html,body{width:100%;height:100%;margin:0;background:#07111f;color:#f8fafc;font-family:Segoe UI,Arial,sans-serif}.boot{display:grid;place-items:center;height:100%}</style>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <main class="shell">
    <header class="toolbar" aria-label="Instructor controls">
      <div class="brand"><strong>SBRS</strong><span>Vehicle Dynamics POC</span></div>
      <label>Scenario<select id="scene-select" aria-label="Teaching scenario"></select></label>
      <button id="save-scene-assignment" type="button">Save slide scene</button>
      <label>Vehicle<select id="vehicle-select" aria-label="Vehicle"></select></label>
      <button id="replay-button" type="button">Replay</button>
    </header>
    <section class="viewport" aria-label="Live vehicle dynamics application">
      <iframe id="vehicle-frame" title="SBRS Vehicle Dynamics" allow="fullscreen; autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>
    <footer class="status" aria-live="polite">
      <span id="status-text" data-level="loading">Loading hosted Vehicle Dynamics…</span>
      <span class="version">Build <span id="build-version">loading</span></span>
    </footer>
  </main>
  <script>
    (async function () {
      let build = "dev";
      try {
        const response = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
        build = (await response.json()).version || build;
      } catch (_error) {}
      window.SBRS_POC_BUILD_VERSION = build;
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "design-tokens.css?v=" + encodeURIComponent(build);
      document.head.appendChild(css);
      for (const file of ["poc-config.js", "content.js"]) {
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = file + "?v=" + encodeURIComponent(build);
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      }
    })();
  </script>
</body>
</html>
